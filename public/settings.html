<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Settings</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <div class="muted" style="font-weight:600;">Settings</div>
      <a class="linkBtn" href="/library.html">Back</a>
    </div>
  </div>

  <div style="max-width:720px;margin-top:16px;display:flex;flex-direction:column;gap:16px;">
    <div>
      <div class="muted">Library default sort</div>
      <select id="setLibrarySort">
        <option value="name">Name (A–Z)</option>
        <option value="lastOpened">Last read</option>
      </select>
    </div>

    <div>
      <div class="muted">Download format</div>
      <select id="setDownloadFormat">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </div>

    <div>
      <div class="muted">JPG quality (only for JPG)</div>
      <input id="setJpgQuality" type="range" min="0.1" max="1" step="0.05" value="0.9"/>
      <div id="jpgQualityLabel" class="muted"></div>
    </div>

    <label style="display:flex;gap:10px;align-items:center;">
      <input id="setShowDownloadSides" type="checkbox"/>
      <span>Show extra download buttons (left/right) in reader</span>
    </label>

    <button id="saveSettings">Save</button>
    <div id="saveMsg" class="muted"></div>
  </div>

  <script src="/settings.js"></script>
</body>
</html>
